[project]
name = "chicago-housing-road-exposure"
version = "0.1.0"
description = "Reproducible Chicago housing permit counts and road-exposure analysis"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "requests>=2.32,<3",
  "numpy>=2,<3",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_housing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
